server {
    listen 80;
    server_name _;

    root /var/www/nuist/frontend/dist;
    index index.html;

    client_max_body_size 5m;

    # 传输压缩（JS/CSS/JSON/SVG）；APK 走下方独立 location，不 gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2;

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # APK: already-compressed binary — no gzip, sendfile, no rate limit
    location ~* \.apk$ {
        gzip off;
        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # 巧克力记账：/app 是 SPA 路由，同时 /app/* 放静态 APK/update.json
    location = /app {
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }
    location = /app/ {
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }
    location /app/ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
